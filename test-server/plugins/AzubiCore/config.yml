  # 'texture' akzeptiert drei Schreibweisen:
  #   1. Voller URL   : https://textures.minecraft.net/texture/<hash>
  #   2. Nur der Hash : <hash>            <- wird hier verwendet
  #   3. Base64-Value : eyJ0ZXh0dXJlcyI6ey...
