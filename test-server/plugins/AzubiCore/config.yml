# ==========================================================================
# MODUL 7 - HOMES
# ==========================================================================
homes:
  # Wie viele Homes darf ein Spieler setzen? Eins - und dabei soll es bleiben:
  # kein Meilenstein der Gemeindekasse vergibt den Effekt HOME_EXTRA.
  max-homes: 1
  # Zusaetzlich gestaffelte Rechte auswerten: azubicore.homes.<anzahl>
  # Beispiel: azubicore.homes.10 erlaubt zehn Homes. Der hoechste Treffer
  # gewinnt, azubicore.homes.unlimited hebt das Limit ganz auf.
  # Wirkt nur, wenn ein Rechte-Plugin so einen Knoten ausdruecklich vergibt -
  # von allein bekommt niemand mehr als das eine Home oben.
  permission-tiers: true
  # Name, der bei /sethome und /home ohne Argument verwendet wird.
  default-name: home
  # Welten, in denen kein Home gesetzt werden darf.
  disabled-worlds: []

  costs:
    # Preis fuer /sethome (auch beim Verschieben eines bestehenden Homes).
    set:
      material: DIAMOND
      amount: 5
    # Preis pro Sprung mit /home. Ein ganzer Diamantblock - der Sprung soll
    # eine Entscheidung sein und nicht die Standard-Fortbewegung.
    teleport:
      material: DIAMOND_BLOCK
      amount: 1
    # Ist das allererste Home eines Spielers gratis?
    first-home-free: false
    # Beim Loeschen die Setzkosten erstatten?
    refund-on-delete: false

  # Ein Sprung pro Tag - genau wie /spawn (Modul 8). Der Stand liegt in der
  # Datenbank und ist damit weder durch Neustart noch durch Aus- und Einloggen
  # zu umgehen. Wer azubicore.homes.nolimit hat (Standard: OP), ist ausgenommen;
  # ein Admin hebt eine Sperre mit /homes reset SPIELER auf.
  daily-limit:
    enabled: true
    # ROLLING  = 24 Stunden ab der letzten Nutzung (siehe cooldown-hours)
    # MIDNIGHT = jeden Kalendertag neu, um Mitternacht Serverzeit
    reset-mode: ROLLING
    cooldown-hours: 24

  teleport:
    # Sekunden Stillstehen vor dem Sprung - zugleich die Dauer der Animation.
    # 0 = sofort teleportieren.
    warmup-seconds: 4
    cancel-on-move: true
    cancel-on-damage: true
    # Abklingzeit zwischen zwei Spruengen in Sekunden. Bei aktivem Tageslimit
    # ueberfluessig, deshalb 0.
    cooldown-seconds: 0
    # Ziel auf Lava und Zubauen pruefen und den Sprung notfalls verweigern.
    require-safe-location: true

  # Dieselbe Aufladeanimation wie beim Spawn-Sprung (Modul 8): Spirale,
  # Bodenring, steigender Ton, Ankunftswelle am Ziel.
  animation:
    enabled: true
    spiral-particle: END_ROD
    ring-particle: PORTAL
    arrival-particle: REVERSE_PORTAL
    # Nur relevant, wenn oben ein DUST-Partikel eingetragen wird.
    dust-color: "#5EE7DF"

# ==========================================================================
# MODUL 8 - SPAWN
# ==========================================================================
spawn:
  # Preis pro Reise. amount: 0 macht den Sprung kostenlos.
  cost:
    material: EMERALD
    amount: 8

  # Wie das Tageslimit zurueckgesetzt wird:
  #   ROLLING  = 24 Stunden ab der letzten Nutzung (siehe cooldown-hours)
  #   MIDNIGHT = jeden Kalendertag neu, um Mitternacht Serverzeit
  reset-mode: ROLLING
  cooldown-hours: 24

  animation:
    # Dauer der Aufladephase in Sekunden. 0 = sofort teleportieren.
    duration-seconds: 4
    cancel-on-move: true
    cancel-on-damage: true
    # Partikel der aufsteigenden Spirale um den Spieler.
    spiral-particle: END_ROD
    # Partikel des Bodenrings, der sich zusammenzieht.
    ring-particle: PORTAL
    # Partikel der Ankunftswelle am Spawn.
    arrival-particle: REVERSE_PORTAL
    # Nur relevant, wenn oben ein DUST-Partikel eingetragen wird.
    dust-color: "#5EE7DF"

# Der Spawnpunkt selbst wird im Spiel mit /spawn setzen festgelegt und in der
# Datenbank abgelegt. Ohne gesetzten Punkt wird der Weltspawn der Hauptwelt
# verwendet. Laeuft Modul 9, gilt der Spawn der Karte, auf der der Spieler
# gerade ist - /spawn holt niemanden von der alten auf die neue Karte.

# ==========================================================================
# MODUL 9 - WELTEN (mehrere Karten mit je eigenem Spielstand)
# ==========================================================================
# Jede "Gruppe" ist eine Karte und besteht aus ihren Welten - ueblicherweise
# Oberwelt, Nether und End. Innerhalb einer Gruppe nimmt der Spieler alles mit,
# ueber die Gruppengrenze hinweg nichts: Inventar, Enderkiste und Erfahrung
# werden pro Karte getrennt gefuehrt.
#
# WICHTIG: Die Welt-Namen muessen exakt den Ordnernamen auf dem Server
# entsprechen. Beim Start schreibt AzubiCore fuer jede geladene Welt in die
# Konsole, zu welcher Karte sie gehoert - dort bitte einmal nachsehen.
# Welten, die in keiner Gruppe auftauchen, landen mit einer Warnung in der
# Standardgruppe.
welten:
  standard-gruppe: neu

  gruppen:
    alt:
      name: "Alte Welt"
      # MiniMessage-Baustein fuer Chat, Tab-Liste und Wechsel-Titel.
      tag: "<gold>[Alt]</gold>"
      welten:
        - alt_world
        - alt_world_nether
        - alt_world_the_end
      # Weltgrenze dieser Karte. aktiv: false laesst die Border unangetastet -
      # dann gilt weiter, was der Server oder ein anderes Plugin gesetzt hat.
      # groesse und zentrum gelten fuer die Oberwelt; im Nether rechnet das
      # Plugin automatisch durch 8, damit die Grenze zum Portal-Netz passt.
      grenze:
        aktiv: true
        groesse: 6000
        zentrum-x: 0
        zentrum-z: 0
        warn-abstand: 32
        schaden: 0.2
        schaden-puffer: 5

    neu:
      name: "Neue Welt"
      tag: "<aqua>[Neu]</aqua>"
      welten:
        - world
        - world_nether
        - world_the_end
      grenze:
        aktiv: false
        groesse: 20000
        zentrum-x: 0
        zentrum-z: 0
        warn-abstand: 32
        schaden: 0.2
        schaden-puffer: 5

  # Was pro Karte getrennt gefuehrt wird. Alles, was hier auf false steht,
  # nimmt der Spieler ueber die Kartengrenze hinweg mit.
  trennen:
    inventar: true
    enderkiste: true
    erfahrung: true
    leben-und-hunger: true
    effekte: true
    spielmodus: false

  # Der Wechsel per /map <karte>. Die Aufwaermzeit verhindert, dass der
  # Kartenwechsel zum Fluchtknopf aus jedem Kampf wird.
  wechsel:
    aufwaermzeit-sekunden: 5
    abklingzeit-sekunden: 60
    abbruch-bei-bewegung: true
    abbruch-bei-schaden: true
    titel-anzeigen: true

  # Anzeige im Chat. <tag> ist der Baustein der Karte, <name> der Anzeigename
  # des Spielers und <nachricht> der geschriebene Text.
  chat:
    aktiv: true
    format: "<tag> <name><gray>:</gray> <nachricht>"
    # true = nur Spieler derselben Karte sehen die Nachricht.
    getrennt: false

  # Anzeige in der Tab-Liste.
  tablist:
    aktiv: true
    format: "<tag> <name>"

# Der Spawn einer Karte wird im Spiel mit /map setzen <karte> festgelegt und in
# der Datenbank abgelegt. Ohne gesetzten Punkt gilt der Weltspawn der ersten
# Welt der Gruppe.

# ==========================================================================
# MODUL 10 - SPIELSTART
# ==========================================================================
# Haelt den Server vor dem Beginn in einem Wartezustand: winzige Weltgrenze,
# Bauen gesperrt. Ein Admin gibt mit /start frei - dann laeuft ein Countdown
# und die Border waechst sichtbar auf ihre Zielgroesse.
#
# !!! Dieses Modul steht oben absichtlich auf FALSE. Wird es eingeschaltet und
# !!! der Server neu gestartet, ist der Server SOFORT gesperrt und die Border
# !!! zieht sich auf start-groesse zusammen - auf allen Welten, die unten
# !!! erfasst sind. Erst einschalten, wenn der Server wirklich neu beginnt.
#
# Der Zustand liegt in der Datenbank: nach dem /start bleibt der Server auch
# ueber Neustarts hinweg offen.
start:
  border:
    # Groesse waehrend der Wartezeit (Kantenlaenge in Bloecken). Gilt in jeder
    # Welt gleich - anders als die Zielgroesse wird sie im Nether NICHT
    # geachtelt, sonst blieben dort nur 12 Bloecke uebrig.
    start-groesse: 100
    # Groesse nach dem Start. Im Nether wird durch 8 geteilt, damit die Grenze
    # zum Portal-Netz passt.
    ziel-groesse: 6000
    # Wie lange die Border von start- auf ziel-groesse waechst. Minecraft
    # animiert das selbst. 0 = sofort springen.
    wachstum-sekunden: 600
    # true  = jede Welt wird auf ihrem eigenen Weltspawn zentriert
    # false = feste Koordinaten unten (Oberwelt-Koordinaten; im Nether teilt
    #         das Plugin sie wie die Groesse durch 8)
    zentrum-am-weltspawn: true
    zentrum-x: 0
    zentrum-z: 0
    warn-abstand: 16
    schaden: 0.2

  # Welche Welten der Start erfasst. ["*"] = alle geladenen Welten.
  welten: ["*"]
  # Ausnahmen - hier gehoert die ALTE Karte hinein, wenn dort schon gespielt
  # wird: sonst wird sie mitgesperrt und beim Start werden die Inventare der
  # dort eingeloggten Spieler mit geleert.
  ausgenommene-welten: []

  # Sekunden Countdown vor der Freigabe. 0 = sofort starten.
  countdown-sekunden: 10

  # Was waehrend der Wartezeit gesperrt ist. Schaden, Hunger und Mobs bleiben
  # an - es fuehlt sich schon nach Survival an, man kann nur nichts anfangen.
  # Wer azubicore.start.bypass hat (Standard: OP), darf trotzdem bauen und so
  # den Spawn vorbereiten.
  vor-dem-start:
    bauen-verbieten: true
    kisten-sperren: true
    eimer-sperren: true

  # Was der /start ausserdem ausloest.
  beim-start:
    zum-spawn-teleportieren: true
    inventare-leeren: true
    erfahrung-leeren: true
    zeit-auf-morgen: true
    wetter-klar: true

  texte:
    wartebalken: "<yellow>Der Server ist noch nicht gestartet"

# ==========================================================================
# MODUL 11 - ZUGANG (Whitelist-Meldung und Wartungsmodus)
# ==========================================================================
# Die Whitelist selbst bleibt die von Minecraft - Namen pflegst du weiter mit
# /whitelist add NAME. Dieses Modul ersetzt nur die nackte Standardmeldung
# durch einen Text, der erklaert, wie man reinkommt.
#
# In allen Meldungen ersetzbar:
#   <spieler>  Name des Spielers, der abgewiesen wird
#   <discord>  der Kontakt aus 'discord' weiter unten
#
# Mit /zugang vorschau siehst du die Meldungen im Chat, ohne dich aussperren
# zu muessen.
zugang:
  # Taucht ueber <discord> in den Meldungen auf.
  discord: "marlon.dev"

  whitelist:
    nachricht:
      - "<red><bold>Kein Zugang</bold>"
      - ""
      - "<gray>Du stehst noch nicht auf der Whitelist."
      - "<white>Schick deinen Minecraft-Namen per Discord an <aqua><discord></aqua>."
      - ""
      - "<gray>Dein Name: <yellow><spieler>"

  wartung:
    # Startwert beim allerersten Start. Danach gilt, was zuletzt mit
    # /zugang wartung geschaltet wurde - das ueberlebt Neustarts.
    aktiv: false
    nachricht:
      - "<gold><bold>Wartungsarbeiten</bold>"
      - ""
      - "<gray>Der Server wird gerade vorbereitet."
      - "<white>Schau gleich nochmal rein."
      - ""
      - "<dark_gray>Fragen? Discord: <discord>"
    # Beim Einschalten alle herausschicken, die nicht hereindurften.
    online-spieler-kicken: true
    # Anzeige in der Serverliste, solange die Wartung laeuft (max. 2 Zeilen).
    serverliste:
      aktiv: true
      motd:
        - "<gold><bold>Wartungsarbeiten</bold>"
        - "<gray>Bitte spaeter nochmal versuchen"

# Wer azubicore.zugang.wartung hat (Standard: OP), kommt waehrend der Wartung
# herein. OPs kommen zusaetzlich immer durch - sonst koennte ein falsch
# gesetztes Rechte-Plugin dich aus deinem eigenen Server aussperren.

# ==========================================================================
# MODUL 12 - HILFE (Wegweiser fuer Spieler)
# ==========================================================================
# /hilfe zeigt alle Funktionen des Servers - als GUI, oder mit
# /hilfe <thema> als Text im Chat zum Nachlesen. Beim ersten Betreten
# bekommt jeder Spieler ausserdem genau einmal eine kurze Nachricht, die
# auf /hilfe hinweist.
#
# Zwei Dinge halten die Texte von allein aktuell:
#   * Ein Eintrag mit 'modul:' verschwindet, sobald das Modul oben in
#     'modules:' abgeschaltet ist. Es steht also nie Hilfe zu etwas da,
#     was es auf diesem Server gar nicht gibt.
#   * Die Platzhalter unten holen Preise und Grenzen aus dem laufenden
#     Modul. Aenderst du weiter oben einen Preis, aendert sich der
#     Hilfetext mit - von Hand nachpflegen musst du nichts.
#
# Platzhalter (nutzbar in 'kopfzeile', 'kurz', 'text' und in der
# Willkommensnachricht):
#   <spieler>              Name des Lesers
#   <fundbuero_karte>      Preis der Bergungskarte        z.B. "3x Diamond"
#   <fundbuero_rueckkauf>  Preis des Direkt-Rueckkaufs
#   <fundbuero_schutz>     Schutzdauer eines Grabes       z.B. "24 Stunden"
#   <auftrag_max>          offene Auftraege pro Spieler
#   <auftrag_gebuehr>      Gebuehr pro Auftrag            z.B. "1x Diamond"
#   <bahn_strecke>         Schienenbloecke bis zum Boost
#   <bahn_tempo>           Beschleunigungsfaktor          z.B. "3.5"
#   <koepfe_preis>         Preis pro Kopf
#   <koepfe_kategorien>    Anzahl der Kategorien
#   <kasse_meilensteine>   Anzahl der Meilensteine
#   <home_setzen>          Preis fuer /sethome
#   <home_teleport>        Preis fuer /home
#   <home_limit>           "einmal am Tag" oder "ohne Tageslimit"
#   <home_max>             erlaubte Homes des Lesers
#   <spawn_kosten>         Preis fuer /spawn
#   <karten>               Namen der Karten     z.B. "Alte Welt, Neue Welt"
# Ist das zugehoerige Modul abgeschaltet, steht dort ein "-".
hilfe:
  gui-titel: "<dark_gray>Serverhilfe"

  # Kopfzeile im GUI - der eine Gedanke, der alles andere erklaert.
  kopfzeile:
    - "<gray>Es gibt hier kein /money und keine Shops."
    - "<gray>Bezahlt wird mit echten <white>Diamanten</white> und <white>Smaragden</white>"
    - "<gray>aus deinem Inventar."
    - ""
    - "<yellow>Klick ein Thema an."

  # Einmalige Nachricht beim ersten Betreten. Wer sie gesehen hat, steht in
  # der Datenbank - sie kommt also genau einmal, auch bei Spielern, die
  # schon vor der Installation des Plugins hier waren.
  #
  # Selbst nochmal ansehen:      /hilfe willkommen
  # Bei jemandem zuruecksetzen:  /hilfe reset SPIELER
  willkommen:
    aktiv: true
    # Sekunden nach dem Betreten. Etwas Abstand ist gut - sonst scrollen
    # Login-Meldungen und Postfach-Hinweise darueber hinweg.
    verzoegerung: 4
    # Leer lassen fuer keinen Ton. ENTITY_PLAYER_LEVELUP und
    # entity.player.levelup sind beide erlaubt.
    ton: ENTITY_PLAYER_LEVELUP
    titel: "<gradient:#5ee7df:#b490ca><bold>Willkommen</bold></gradient>"
    untertitel: "<gray>Tippe <white>/hilfe</white>"
    # Kurz halten: die Nachricht soll nur den Weg zeigen, nicht erklaeren.
    zeilen:
      - ""
      - "<gray>Hallo <white><spieler></white> - schoen, dass du da bist."
      - "<gray>Dieser Server hat ein paar eigene Funktionen: Graeber,"
      - "<gray>Auftraege, eine Gemeindekasse und mehr."
      - ""
      - "<white>Was das alles ist, steht in der Serverhilfe:"
      - "<yellow><click:run_command:'/hilfe'>» hier klicken oder /hilfe eintippen «</click>"
      - ""

  # Reihenfolge hier = Reihenfolge im GUI. Der Schluessel ist zugleich das
  # Argument von /hilfe <thema>. Die Namen 'willkommen' und 'reset' sind
  # durch die Unterbefehle belegt.
  #
  # Je Eintrag:
  #   modul:         optional - Thema nur zeigen, wenn das Modul laeuft
  #   material:      Symbol im GUI
  #   titel:         Ueberschrift
  #   kurz:          ein bis zwei Zeilen fuer die Uebersicht
  #   text:          der ausfuehrliche Text
  #   befehl:        optional - Knopf "Oeffnen" im GUI
  #   berechtigung:  optional - Thema nur mit diesem Recht sichtbar
  #
  # Es passen 28 Themen ins GUI. Weitere bleiben ueber /hilfe <thema>
  # erreichbar, tauchen dort aber nicht mehr auf.
  eintraege:

    bezahlen:
      material: EMERALD
      titel: "<green><bold>Bezahlen</bold>"
      kurz:
        - "<gray>Wie Preise auf diesem Server funktionieren."
      text:
        - "<gray>Es gibt kein Kontoguthaben. Alles, was etwas kostet, wird"
        - "<gray>direkt aus deinem Inventar bezahlt - meist mit Diamanten"
        - "<gray>oder Smaragden."
        - ""
        - "<gray>Bezahlt wird nur mit <white>unveraenderten</white> Items. Ein umbenannter"
        - "<gray>oder verzauberter Diamant zaehlt nicht - so wird dir nie"
        - "<gray>versehentlich ein Sammlerstueck abgezogen."

    fundbuero:
      modul: fundbuero
      material: CHEST
      titel: "<gold><bold>Fundbuero</bold>"
      kurz:
        - "<gray>Deine Sachen ueberleben deinen Tod."
      text:
        - "<gray>Stirbst du, fliegen deine Sachen nicht herum: sie landen in"
        - "<gray>einer Grabkiste an deinem Todesort. Fuer <white><fundbuero_schutz></white> kommst"
        - "<gray>nur du daran."
        - ""
        - "<gray>Mit <white>/fundbuero</white> siehst du deine letzten Graeber. Dort gibt"
        - "<gray>es zwei kostenpflichtige Abkuerzungen:"
        - "<dark_gray> - <white>Bergungskarte</white> <gray>(<white><fundbuero_karte></white>) zeigt die Koordinaten"
        - "<dark_gray> - <white>Rueckkauf</white> <gray>(<white><fundbuero_rueckkauf></white>) holt alles sofort zurueck"
        - ""
        - "<gray>Selbst hinlaufen ist und bleibt gratis."
      befehl: "/fundbuero"

    homes:
      modul: homes
      material: RED_BED
      titel: "<red><bold>Homes</bold>"
      kurz:
        - "<gray>Ein fester Rueckweg nach Hause."
      text:
        - "<gray>Mit <white>/sethome</white> merkst du dir deinen Wohnort, mit <white>/home</white>"
        - "<gray>reist du dorthin."
        - ""
        - "<dark_gray> - <gray>Erlaubte Homes: <white><home_max>"
        - "<dark_gray> - <gray>Setzen: <white><home_setzen>"
        - "<dark_gray> - <gray>Teleport: <white><home_teleport>"
        - ""
        - "<gray>Der Sprung ist absichtlich teuer und <white><home_limit></white> moeglich."
        - "<gray>Er ersetzt keinen Weg, sondern den Heimweg am Abend."
        - ""
        - "<gray>Wann du wieder darfst: <white>/homes info"
      befehl: "/homes"

    spawn:
      modul: spawn
      material: COMPASS
      titel: "<aqua><bold>Spawn</bold>"
      kurz:
        - "<gray>Einmal am Tag zurueck zum Startpunkt."
      text:
        - "<gray><white>/spawn</white> bringt dich zum Spawnpunkt des Servers - einmal"
        - "<gray>pro Tag und gegen <white><spawn_kosten></white>."
        - ""
        - "<gray>Vorher laeuft eine kurze Aufladung. Bewegst du dich oder"
        - "<gray>nimmst du Schaden, bricht sie ab - bezahlt wird erst beim"
        - "<gray>Ankommen, ein Abbruch kostet dich also nichts."
        - ""
        - "<gray>Wann du wieder darfst: <white>/spawn info"
      befehl: "/spawn"

    auftragsboerse:
      modul: auftragsboerse
      material: WRITABLE_BOOK
      titel: "<yellow><bold>Auftragsboerse</bold>"
      kurz:
        - "<gray>Arbeit ausschreiben statt selbst graben."
      text:
        - "<gray>Du brauchst fuenf Stapel Sand und keine Lust zu graben?"
        - "<gray>Schreib einen Auftrag aus - jemand anderes liefert."
        - ""
        - "<gray>Die Belohnung hinterlegst du beim Erstellen. Sie liegt bis"
        - "<gray>zur Lieferung treuhaenderisch beim Server: niemand kann mit"
        - "<gray>etwas werben, das er gar nicht hat."
        - ""
        - "<dark_gray> - <white>/auftrag list</white> <gray>offene Auftraege"
        - "<dark_gray> - <white>/auftrag create</white> <gray>selbst einen ausschreiben"
        - "<dark_gray> - <white>/auftrag meine</white> <gray>deine eigenen"
        - "<dark_gray> - <white>/auftrag post</white> <gray>dein Postfach"
        - ""
        - "<gray>Grosse Auftraege lieferst du in mehreren Fuhren: gib ab,"
        - "<gray>was du tragen kannst, der Rest bleibt in der Treuhand liegen."
        - "<gray>Der Auftrag gehoert dir, bis du fertig bist oder aufgibst"
        - "<gray>(<white>/auftrag abbrechen ID</white> holt deine Ware zurueck)."
        - "<gray>Gefuellte Shulkerkisten zaehlen mit ihrem Inhalt."
        - ""
        - "<gray>Das Ausschreiben kostet <white><auftrag_gebuehr></white>. Die Gebuehr ist"
        - "<gray>weg, sobald der Auftrag haengt - auch wenn du ihn abbrichst."
        - "<gray>Deshalb: lieber einen Auftrag, den jemand erfuellen will,"
        - "<gray>als drei zum Ausprobieren."
        - ""
        - "<gray>Gleichzeitig offen: <white><auftrag_max></white> Auftraege pro Spieler."
      befehl: "/auftrag list"

    gemeindekasse:
      modul: gemeindekasse
      material: GOLD_BLOCK
      titel: "<gold><bold>Gemeindekasse</bold>"
      kurz:
        - "<gray>Das gemeinsame Ziel des Servers."
      text:
        - "<gray>Die Gemeindekasse ist der gemeinsame Vorrat aller Spieler."
        - "<gray>Jeder kann einzahlen - was drin ist, zaehlt fuer alle."
        - ""
        - "<gray>Mit jedem erreichten Meilenstein wird etwas fuer den ganzen"
        - "<gray>Server besser: schnellere Loren, guenstigere Preise, neue"
        - "<gray>Kopf-Kategorien, laengerer Grabschutz und mehr."
        - ""
        - "<gray>Es gibt <white><kasse_meilensteine></white> Stueck, und sie werden nach hinten"
        - "<gray>deutlich teurer."
        - ""
        - "<dark_gray> - <white>/gemeindekasse</white> <gray>Stand und Meilensteine"
        - "<dark_gray> - <white>/gemeindekasse einzahlen</white> <gray>Items abgeben"
      befehl: "/gemeindekasse"

    koepfe:
      modul: koepfe
      material: PLAYER_HEAD
      titel: "<light_purple><bold>Koepfe-Katalog</bold>"
      kurz:
        - "<gray>Dekorative Koepfe fuer deine Bauten."
      text:
        - "<gray>Ueber <white>/heads</white> kaufst du dekorative Koepfe."
        - "<gray>Preis: <white><koepfe_preis></white> pro Stueck."
        - ""
        - "<gray>Es gibt <white><koepfe_kategorien></white> Kategorien. Ein Teil davon ist zu Beginn"
        - "<gray>gesperrt und wird ueber Meilensteine der Gemeindekasse"
        - "<gray>freigeschaltet."
        - ""
        - "<gray>Gutscheine aus Versorgungskisten loest du ein, indem du sie"
        - "<gray>in die Hand nimmst und <white>rechtsklickst</white>."
      befehl: "/heads"

    versorgungskisten:
      modul: versorgungskisten
      material: TRAPPED_CHEST
      titel: "<dark_aqua><bold>Versorgungskisten</bold>"
      kurz:
        - "<gray>Beute fuer den, der zuerst da ist."
      text:
        - "<gray>In unregelmaessigen Abstaenden faellt irgendwo auf der Karte"
        - "<gray>eine Versorgungskiste. Der Fundort wird im Chat angesagt."
        - ""
        - "<gray>Drin ist meistens Baumaterial, manchmal etwas Wertvolles -"
        - "<gray>und ganz selten eine Schmiedevorlage."
        - ""
        - "<gray>Die Kiste gehoert niemandem. Wer zuerst da ist, nimmt mit."

    schnellbahn:
      modul: schnellbahn
      material: MINECART
      titel: "<white><bold>Schnellbahn</bold>"
      kurz:
        - "<gray>Loren werden auf langen Strecken schneller."
      text:
        - "<gray>Es gibt hier keine Teleportbefehle quer ueber die Karte."
        - "<gray>Dafuer lohnt sich der Schienenbau wirklich:"
        - ""
        - "<gray>Faehrst du <white><bahn_strecke></white> Bloecke am Stueck auf Schienen, schaltet"
        - "<gray>deine Lore auf das <white><bahn_tempo>-fache</white> Tempo hoch. In Kurven und"
        - "<gray>vor Streckenenden bremst sie von selbst wieder ab."
        - ""
        - "<gray>Es zaehlen nur besetzte Loren - Gueterloren bleiben normal."
      befehl: "/schnellbahn info"

    karten:
      modul: welten
      material: FILLED_MAP
      titel: "<blue><bold>Karten</bold>"
      kurz:
        - "<gray>Mehrere Welten, getrennte Spielstaende."
      text:
        - "<gray>Auf diesem Server gibt es mehr als eine Karte:"
        - "<white><karten></white>."
        - ""
        - "<gray>Jede Karte hat ihren <white>eigenen</white> Spielstand. Inventar,"
        - "<gray>Enderkiste und Erfahrung werden getrennt gefuehrt: was du"
        - "<gray>drueben liegen laesst, liegt beim naechsten Besuch noch da."
        - ""
        - "<gray>Wechseln mit <white>/map</white>. Der Wechsel ist gefahrlos, du kannst"
        - "<gray>jederzeit zurueck."
      befehl: "/map"

    spielstart:
      modul: start
      material: BEACON
      titel: "<red><bold>Spielstart</bold>"
      kurz:
        - "<gray>Warum die Welt gerade noch klein ist."
      text:
        - "<gray>Der Server ist noch in Vorbereitung. Bis zur Freigabe ist"
        - "<gray>die Weltgrenze eng gesteckt und Bauen gesperrt."
        - ""
        - "<gray>Mit der Freigabe waechst die Grenze auf ihre volle Groesse"
        - "<gray>und alle starten gemeinsam."
        - ""
        - "<gray>Aktueller Stand: <white>/start info"
      befehl: "/start info"

    end:
      modul: end
      material: END_PORTAL_FRAME
      titel: "<light_purple><bold>Das End</bold>"
      kurz:
        - "<gray>Warum das Endportal nicht funktioniert."
      text:
        - "<gray>Das End ist auf diesem Server vorerst <white>gesperrt</white>."
        - "<gray>Portale bleiben zu, und wer es doch hineinschafft,"
        - "<gray>wird zurueck zum Spawn gebracht."
        - ""
        - "<gray>Das ist Absicht: Elytra, Shulker und Drachenkopf sollen"
        - "<gray>nicht in der ersten Woche schon jedem gehoeren."
        - ""
        - "<gray>Aktueller Stand: <white>/endsperre"
      befehl: "/endsperre"


# ==========================================================================
# MODUL 13 - VERWALTUNG (Hot-Reload und Modul-Schalter)
# ==========================================================================
# Aendert Konfiguration und Module im laufenden Betrieb - ohne Serverneustart
# und ohne das gefaehrliche /reload des Servers.
#
#   /verwaltung                    Zustand aller Module
#   /verwaltung gui                dasselbe zum Anklicken
#   /verwaltung reload             diese Datei lesen, ALLE Module neu starten
#   /verwaltung reload [modul]     diese Datei lesen, nur dieses Modul neu starten
#   /verwaltung an [modul]         einschalten (bleibt auch nach Neustart an)
#   /verwaltung aus [modul]        abschalten (bleibt auch nach Neustart aus)
#   /verwaltung neustart [modul]   nur neu starten, Schalter bleibt wie er ist
#   /verwaltung standard [modul]   Laufzeit-Schalter loeschen, es gilt wieder
#                                  der Wert aus 'modules:' oben
#
# Warum ein Modul-NEUSTART und nicht nur ein Neulesen der Datei: jedes Modul
# liest seine Werte beim Start einmal in den Speicher (Preise, Materialien,
# Texte, Weltnamen). Ein blosses Neulesen wuerde deshalb fast nirgends
# ankommen. Beim Neustart meldet das Plugin Listener, Tasks und Befehle sauber
# ab und baut sie neu auf - derselbe Weg wie beim Serverstart.
#
# Was das im Betrieb bedeutet:
#   - Offene Fenster (GUIs) werden geschlossen; eingelegte Items kommen zurueck.
#   - Laufende Vorgaenge des betroffenen Moduls brechen ab: Teleport-Countdowns,
#     der Countdown von /start, Partikelsaeulen ueber Versorgungskisten.
#   - Alles, was in der Datenbank steht (Graeber, Auftraege, Homes, Gemeinde-
#     kasse, Wartungsmodus), bleibt unangetastet und wird neu geladen.
#
# 'an'/'aus' landen NICHT in dieser Datei, sondern in der Datenbank (Tabelle
# settings, Schluessel modules.<id>). Diese Datei bleibt damit exakt so, wie du
# sie geschrieben hast - mit allen Kommentaren. Ein Schalter aus der Datenbank
# hat Vorrang vor 'modules:' oben; '/verwaltung standard [modul]' loescht ihn.
# ==========================================================================
verwaltung:
  gui-titel: "<dark_gray>Modulverwaltung"

# ==========================================================================
# MODUL 14 - ENDSPERRE (kein Rush ins End)
# ==========================================================================
# Haelt das End zu, solange es nicht dran ist. Gesperrt wird an jeder Stelle,
# an der man hineinkommt: das Endportal selbst, jeder andere Teleport in eine
# End-Welt (/tp, Fremdplugins) und - wenn du willst - schon das Bauen des
# Portals.
#
#   /endsperre           Zustand ansehen
#   /endsperre an        End sperren
#   /endsperre aus       End freigeben
#
# Der Zustand liegt in der DATENBANK, nicht hier: 'gesperrt' unten ist nur der
# Startwert beim allerersten Start. Danach gilt, was zuletzt mit /endsperre
# geschaltet wurde - das ueberlebt Neustarts.
#
# Warum nicht 'allow-end: false' in der bukkit.yml: das entfernt die End-Welt
# komplett. Wer beim Umschalten dort steht, verliert seine Position, und der
# Fortschritt der Welt (Drache, Endstaedte) ist beim Wiedereinschalten weg.
# Diese Sperre laesst die Welt bestehen und macht nur die Tuer zu.
#
# Wer azubicore.end.bypass hat (Standard: OP), kommt trotz Sperre hinein.
end:
  # Startwert beim allerersten Start. Danach entscheidet /endsperre.
  gesperrt: true

  # Als End gilt automatisch jede Welt mit End-Umgebung - auch mehrere.
  # Die beiden Listen sind nur fuer Ausnahmen:
  #   zusaetzliche-welten: nachgebautes End in einer normalen Welt
  #   ausgenommene-welten: End-Welt, die trotz Sperre offen bleiben soll
  zusaetzliche-welten: []
  ausgenommene-welten: []

  # Endportal und jeder andere Teleport ins End. Das hier ist die eigentliche
  # Sperre - aus heisst: das End ist offen, egal was oben steht.
  portal-blockieren: true

  # Ender-Augen lassen sich nicht in den Portalrahmen setzen. Damit entsteht
  # das Portal gar nicht erst, statt dass jemand davorsteht und nicht darf.
  rahmen-schuetzen: true

  # Ender-Augen lassen sich gar nicht mehr werfen. Standard aus: die Festung
  # suchen darf man, hinein kommt man trotzdem nicht.
  augen-werfen-verbieten: false

  # Beim Einschalten der Sperre alle aus dem End herausholen.
  beim-einschalten-rausholen: true
  # Wer sich vor der Sperre im End ausgeloggt hat, wird beim Betreten des
  # Servers herausgeholt. Ziel ist der Spawn aus Modul 8.
  beim-join-rausholen: true

  texte:
    portal: "<red>Das End ist auf diesem Server noch gesperrt."
    rahmen: "<red>Das Endportal bleibt geschlossen, solange das End gesperrt ist."
    auge: "<red>Ender-Augen bringen dich gerade nirgendwohin - das End ist gesperrt."
    rausgeholt: "<yellow>Das End ist gesperrt - du wurdest zurueck zum Spawn gebracht."

# ==========================================================================
# MODUL 15 - WELTBONI (Speer und Happy Ghast)
# ==========================================================================
# Zwei Meilenstein-Boni der Gemeindekasse, die an Vanilla-Mechanik haengen und
# deshalb kein eigenes Feature sind: der Speer kostet weniger Hunger
# (SPEAR_HUNGER), und Happy Ghasts fliegen schneller (GHAST_SPEED). Wie stark,
# steht bei den Meilensteinen unter 'gemeindekasse:'. Ohne freigeschalteten
# Meilenstein tut dieses Modul nichts.
boni:
  speer:
    # Schreibt bei jedem Hungerverbrauch mit Speer eine Zeile ins Log (Grund,
    # Wert, Hand). Nur zum Nachmessen gedacht - im Betrieb aus lassen.
    debug: false
    # Wie lange nach dem Ansetzen des Speers ein Hungerverbrauch noch als
    # Speer-Verbrauch zaehlt (Ticks). Deckt den Fall ab, dass Vanilla erst beim
    # Loslassen abrechnet - dann ist die Hand schon wieder unten. Zu gross
    # gewaehlt, wuerde auch normales Sprinten kurz nach dem Speerstoss guenstiger.
    nachlauf-ticks: 10

  happy-ghast:
    # Obergrenze fuer die Summe aller GHAST_SPEED-Meilensteine (1.0 = hoechstens
    # doppeltes Tempo). Sicherheitsnetz, falls jemand die Werte oben hochdreht:
    # sehr schnelle Ghasts fliegen der Chunkladung davon.
    max-bonus: 1.0
