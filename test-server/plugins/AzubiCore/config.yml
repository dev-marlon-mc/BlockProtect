# ==========================================================================
# MODUL 6 - GEMEINDEKASSE (Eco-Tax & Infrastructure Fund)
# ==========================================================================
gemeindekasse:
  # Materialien, die eingezahlt werden koennen. Mehr als sieben passen nicht in
  # die Uebersicht - die Reihenfolge hier ist die Reihenfolge im GUI.
  accepted:
    - material: COBBLESTONE
      display: "<gray>Bruchstein"
    - material: COAL
      display: "<dark_gray>Kohle"
    - material: IRON_INGOT
      display: "<white>Eisenbarren"
    - material: COPPER_INGOT
      display: "<gold>Kupferbarren"
    - material: GOLD_INGOT
      display: "<yellow>Goldbarren"
    - material: EMERALD
      display: "<green>Smaragd"
    - material: DIAMOND
      display: "<aqua>Diamant"

  # Broadcast, wenn ein Spieler eine groessere Menge einzahlt.
  announce-threshold: 256

  # Meilensteine, aufsteigend nach Schwierigkeit. Sie werden in dieser
  # Reihenfolge angezeigt (21 pro Seite) und einzeln freigeschaltet, sobald die
  # Gesamtmenge des jeweiligen Materials erreicht ist.
  #
  # 'effect' steuert, was der Meilenstein bewirkt:
  #   RAIL_SPEED           Modul 3: value = zusaetzlicher Tempo-Anteil (0.20 = +20%)
  #   FUNDBUERO_DISCOUNT   Modul 1: value = Rabatt (0.25 = -25%), mehrere multiplizieren sich
  #   FUNDBUERO_PROTECTION Modul 1: value = zusaetzliche Stunden Grabschutz
  #                        Derzeit bewusst nicht vergeben - der Grabschutz
  #                        bleibt bei der Grundzeit aus 'fundbuero:'.
  #   HEADS_CATEGORY       Modul 5: oeffnet Kategorien mit dieser Meilenstein-ID
  #   HEADS_DISCOUNT       Modul 5: value = Rabatt auf den Kopfpreis
  #   HOME_EXTRA           Modul 7: value = zusaetzliche Homes fuer jeden
  #                        ACHTUNG: hier bewusst NICHT vergeben - es soll bei
  #                        genau einem Home pro Spieler bleiben.
  #   HOME_DISCOUNT        Modul 7: value = Rabatt auf Setzen und Springen
  #   SPAWN_DISCOUNT       Modul 8: value = Rabatt auf die Spawn-Reise
  #   AUFTRAG_SLOTS        Modul 2: value = zusaetzliche offene Auftraege
  #   SUPPLY_ROLLS         Modul 4: value = zusaetzliche Zuege pro Versorgungskiste
  #   SPEAR_HUNGER         Modul 15: value = weniger Hunger beim Speer (0.20 = -20%),
  #                        mehrere multiplizieren sich
  #   GHAST_SPEED          Modul 15: value = zusaetzliches Happy-Ghast-Tempo (0.10 = +10%)
  #   NONE                 rein kosmetisch
  #
  # Rabatte koennen einen Preis nie auf null druecken - mindestens ein Item
  # bleibt immer faellig. Ein Preis von 1 laesst sich also nicht rabattieren.
  milestones:

