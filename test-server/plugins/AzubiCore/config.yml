  # Alle Hashes unten stammen von minecraft-heads.com und wurden einzeln gegen
  # https://textures.minecraft.net verifiziert (HTTP 200). Eigene Koepfe einfach
  # nach demselben Muster ergaenzen - ein ungueltiger Hash erzeugt lediglich
  # einen Standard-Kopf, keinen Fehler.
  #
  # Je Kategorie liegen 45 Koepfe - genau eine Seite im Katalog.
