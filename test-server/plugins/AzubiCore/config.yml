# ==========================================================================
# MODUL 5 - KOEPFE-KATALOG (Chisel & Bits Light)
# ==========================================================================
koepfe:
  # Preis pro Kopf.
  price:
    material: EMERALD
    amount: 1
  # Gutschein-Item, das per Rechtsklick den Katalog kostenlos oeffnet.
  voucher:
    material: PAPER
    name: "<gradient:#f7971e:#ffd200><bold>Kosmetik-Gutschein</bold></gradient>"
    lore:
      - "<gray>Rechtsklick, um einen Kopf"
      - "<gray>kostenlos einzuloesen."

  # Kategorien. 'milestone' verweist auf eine Meilenstein-ID der Gemeindekasse
  # (Modul 6). Solange dieser nicht freigeschaltet ist, bleibt die Kategorie zu.
