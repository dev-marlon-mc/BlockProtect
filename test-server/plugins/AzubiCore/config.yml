# ==========================================================================
#  AzubiCore - Hauptkonfiguration
#  Alle Texte verwenden das MiniMessage-Format (https://docs.advntr.dev)
#  Waehrung = echte Vanilla-Items. Es wird KEIN Vault/Economy-Plugin genutzt.
#
#  Diese Datei liegt zweimal identisch im Projekt: als config.example.yml
#  zum Nachschlagen und als mitgelieferte Standardkonfiguration. Ein Server
#  mit bereits vorhandener plugins/AzubiCore/config.yml uebernimmt sie NICHT
#  automatisch - dort die alte Datei loeschen oder von Hand ergaenzen.
#
#  ACHTUNG - im Spiel geaenderte Werte gehen dieser Datei vor:
#  '/verwaltung einstellungen' kann jeden Wert hier im Spiel aendern. Solche
#  Aenderungen landen in der Datenbank (Tabelle 'settings', Schluessel
#  'config.<pfad>') und ueberschreiben beim Start, was hier steht - die Datei
#  bleibt dabei unangetastet. Wirkt eine Aenderung an dieser Datei nicht, liegt
#  eine Uebersteuerung vor: im GUI stehen geaenderte Werte in Gold, ein Druck
#  auf F stellt den Dateiwert wieder her. Wie viele es sind, sagt beim Start
#  die Konsole.
# ==========================================================================

general:
  prefix: "<gradient:#5ee7df:#b490ca><bold>AzubiCore</bold></gradient> <dark_gray>» </dark_gray>"
  debug: false

# --------------------------------------------------------------------------
# Modul-Schalter. Ein deaktiviertes Modul registriert weder Events noch Tasks.
# --------------------------------------------------------------------------
modules:
  gemeindekasse: true     # Modul 6 - sollte aktiv bleiben, liefert die Boni
  fundbuero: true         # Modul 1
  auftragsboerse: true    # Modul 2
  schnellbahn: true       # Modul 3
  versorgungskisten: true # Modul 4
  koepfe: true            # Modul 5
  homes: true             # Modul 7
  spawn: true             # Modul 8
  welten: true            # Modul 9 - Welt-Namen unten unbedingt pruefen!
  start: false            # Modul 10 - sperrt den Server! Siehe Warnung unten.
  zugang: true            # Modul 11 - Whitelist-Meldung und Wartungsmodus
  hilfe: true             # Modul 12 - /hilfe und die Willkommensnachricht
  end: true               # Modul 14 - haelt das End zu (Sperre selbst: 'end:' unten)
  boni: true              # Modul 15 - Speer-Hunger und Happy-Ghast-Tempo
  # Modul 13 (Verwaltung) steht bewusst nicht in dieser Liste: es ist der
  # Notausgang, ueber den sich alle anderen wieder einschalten lassen.
  # Details ganz unten unter 'verwaltung:'.

# --------------------------------------------------------------------------
# Wer zahlt? - je Modul mit Kosten einzeln
# --------------------------------------------------------------------------
# Jedes Modul mit Kosten hat eine Permission, die davon befreit. Standard ist
# ueberall 'op', OPs zahlen also von Haus aus nichts:
#
#   fundbuero        azubicore.fundbuero.gratis     Karte und Rueckkauf
#   auftragsboerse   azubicore.auftrag.gebuehrfrei  Gebuehr pro Auftrag
#   koepfe           azubicore.heads.gratis         Preis pro Kopf
#   homes            azubicore.homes.gratis         /sethome und /home
#   spawn            azubicore.spawn.free           /spawn
#
# Hier stellst du je Modul ein, ob diese Befreiung ueberhaupt gilt:
#   true  = ALLE zahlen, auch OPs (die Permission wird ignoriert)
#   false = wer die Permission hat, zahlt nicht
#
# Umschalten im laufenden Betrieb: /verwaltung kosten [modul] an|aus, oder
# im GUI unter /verwaltung gui -> "Kosten und Befreiungen". Das landet wie
# die Modul-Schalter in der Datenbank und hat Vorrang vor dieser Datei;
# '/verwaltung kosten [modul] standard' loescht die Uebersteuerung wieder.
kosten:
  ops-zahlen:
    fundbuero: false
    auftragsboerse: false
    koepfe: false
    homes: false
    spawn: false

# ==========================================================================
# MODUL 1 - FUNDBUERO (Insurance & Recovery)
# ==========================================================================
fundbuero:
  # Wie lange ist das Grab exklusiv fuer den Besitzer reserviert.
  protection-hours: 24
  # Wie lange bleibt der Datenbank-Eintrag nach Ablauf erhalten (Aufraeumen).
  keep-record-days: 14
  # Anzahl der Graeber, die im /fundbuero GUI angezeigt werden.
  max-graves-shown: 5
  # Erfahrungspunkte im Grab aufbewahren statt fallen lassen.
  capture-experience: true
  # Wird ein zweiter Kistenblock gesetzt, wenn 27 Slots nicht reichen?
  allow-second-chest: true
  # Maximale Suchhoehe nach oben, falls der Todesblock nicht bebaubar ist.
  search-up: 8
  # Welten, in denen keine Graeber gesetzt werden (z.B. Minispiel-Welten).
  disabled-worlds: []

  costs:
    # Bergungskarte: zeigt die exakten Koordinaten des Todesortes.
    map:
      material: DIAMOND
      amount: 3
    # Direkt-Rueckkauf: stellt das Inventar sofort wieder her.
    buyback:
      material: DIAMOND
      amount: 32

# ==========================================================================
# MODUL 2 - AUFTRAGSBOERSE (Wandering Contractor, mit Treuhand/Escrow)
# ==========================================================================
auftragsboerse:
  # Maximal offene Auftraege pro Spieler.
  max-open-per-player: 3
  # Laufzeit eines Auftrags in Tagen. Danach wandert die Treuhand zurueck.
  expire-days: 7
  # Grenzen fuer Nachfrage und Belohnung.
  max-request-amount: 3456   # 54 Stacks
  max-reward-amount: 512
  # Materialien, die als Belohnung erlaubt sind (leer = alles erlaubt).
  # Bewusst leer: als Belohnung taugt alles, was nicht in der schwarzen Liste
  # steht. Das Item wandert beim Erstellen sofort in die Treuhand, es kann also
  # niemand mit einer Belohnung werben, die er gar nicht besitzt.
  allowed-reward-materials: []
  # Materialien, die NIE angefordert oder hinterlegt werden duerfen.
  blacklisted-materials:
    - BEDROCK
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - BARRIER
    - LIGHT
    - DEBUG_STICK
    - SPAWNER
  # Nur unveraenderte Items akzeptieren (keine Namen, keine Verzauberungen).
  require-plain-items: true

  # --- Grossauftraege ------------------------------------------------------
  # Geliefert wird in Fuhren: 36 Inventarplaetze mal Stapelgroesse des
  # geforderten Materials. Bei Eichenstaemmen sind das 2304 pro Fuhre, bei
  # Enderperlen (16er-Stapel) 576, bei Betten (nicht stapelbar) 36.
  #
  # Was NICHT reinpasst, bleibt als Teillieferung in der Treuhand liegen, bis
  # der Lieferant die naechste Fuhre bringt. Die erste Fuhre reserviert den
  # Auftrag fuer ihn - sonst waere nicht zu entscheiden, wem die Belohnung
  # zusteht, wenn zwei Spieler je die Haelfte bringen. Gibt er auf
  # (/auftrag abbrechen ID) oder laeuft der Auftrag ab, kommt seine
  # Teillieferung ins Postfach zurueck und der Auftrag ist wieder frei.
  #
  # Wie viele Fuhren ein Auftrag hoechstens kosten darf. Groessere Auftraege
  # lassen sich gar nicht erst anlegen - lieferbar waeren sie, aber niemand
  # faehrt 96 Mal. 0 = keine Begrenzung (dann gilt nur max-request-amount).
  max-lieferungen: 4

  # Gefuellte Shulkerkisten im Abgabefenster akzeptieren. Ihr Inhalt zaehlt
  # mit, die leere Kiste kommt zurueck, Fremdes darin bleibt drin. Eine Kiste
  # fasst 27 Stapel - damit passt ein 3456er-Auftrag in zwei Kisten.
  shulker-abgabe: true

  # Gebuehr fuers Ausschreiben eines Auftrags.
  #
  # Warum: ohne Gebuehr kostet ein Auftrag nichts ausser der Belohnung, die man
  # ohnehin wiederbekommt. Die Boerse wird dadurch zum Tauschautomaten - zwei
  # Spieler schieben sich Items ueber je einen Auftrag hin und her. Die Gebuehr
  # macht genau das teuer; beim echten Auftrag ("ich brauche 5 Stapel Sand")
  # faellt sie neben der Belohnung kaum ins Gewicht.
  #
  # Faellig wird sie beim Erstellen und kommt NICHT zurueck - weder beim
  # Abbrechen (/auftrag abbrechen) noch beim Ablaufen. Zurueck kommt in beiden
  # Faellen nur die hinterlegte Belohnung. Waere die Gebuehr erstattungsfaehig,
  # waere sie geliehen statt bezahlt und wuerde niemanden abhalten.
  #
  # menge: 0 schaltet die Gebuehr ab. Wer azubicore.auftrag.gebuehrfrei hat
  # (Standard: OP), zahlt nie.
  gebuehr:
    material: DIAMOND
    menge: 1

# ==========================================================================
# MODUL 3 - SCHNELLBAHN (Dynamic High-Speed Rail)
# ==========================================================================
schnellbahn:
  # Vanilla-Maximalgeschwindigkeit einer Lore.
  vanilla-max-speed: 0.4
  # Ab wie vielen zusammenhaengend gefahrenen Schienen-Bloecken wird geboostet.
  activation-distance: 30
  # Faktor auf die Vanilla-Geschwindigkeit im Schnellfahrmodus (3.0 - 4.0).
  boost-factor: 3.5
  # Faktor in Kurven / vor Prellbaenden.
  curve-factor: 1.0
  # Wie viele Bloecke vorausgeschaut wird, um Streckenenden zu erkennen.
  lookahead-blocks: 5
  # Nur Loren mit Passagier beschleunigen (verhindert Boost fuer Item-Loren).
  require-passenger: true
  # Sanfte Beschleunigung: die Lore wird pro Tick leicht angeschoben.
  assist: true
  assist-acceleration: 1.06
  # Partikel waehrend der Schnellfahrt.
  particles:
    enabled: true
    type: ELECTRIC_SPARK
    every-n-moves: 3
    count: 4
  # Welten, in denen die Schnellbahn deaktiviert ist.
  disabled-worlds: []

# ==========================================================================
# MODUL 4 - VERSORGUNGSKISTEN (Supply Drops)
# ==========================================================================
versorgungskisten:
  # Abstand zwischen zwei Kisten in Minuten.
  interval-minutes: 240
  # Erste Kiste nach Serverstart (Minuten).
  first-delay-minutes: 20
  # Nur ausloesen, wenn mindestens so viele Spieler online sind.
  min-players-online: 1
  # Kiste verschwindet nach dieser Zeit, falls niemand sie findet (Minuten).
  lifetime-minutes: 90
  # Welten, in denen Kisten spawnen duerfen.
  worlds:
    - world
  # Suchradius um den Weltspawn (Bloecke).
  min-distance: 300
  max-distance: 2500
  # Wie oft eine sichere Position gesucht wird, bevor abgebrochen wird.
  max-attempts: 25
  # Genauigkeit der Broadcast-Koordinaten (auf dieses Raster gerundet).
  coordinate-precision: 100
  # Biome, deren Schluessel eines dieser Fragmente enthaelt, werden gemieden.
  blocked-biome-keywords:
    - ocean
    - river
    - deep_dark
  particles:
    enabled: true
    type: END_ROD
    height: 12
    period-ticks: 15

  loot:
    # Anzahl der gewichteten Zuege pro Kiste. Meilensteine der Gemeindekasse
    # (Modul 6) legen noch etwas drauf.
    min-rolls: 6
    max-rolls: 10
    #
    # Zwei Sorten Eintraege:
    #   weight: gewichteter Anteil am normalen Ziehen
    #   chance: Wahrscheinlichkeit IN PROZENT, einmal pro Kiste, unabhaengig
    #           von der Zahl der Zuege - fuer echte Raritaeten
    # Ein Eintrag mit 'chance' nimmt am gewichteten Ziehen nicht teil.
